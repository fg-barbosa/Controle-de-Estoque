{% extends "base.html" %}
{% block title %}Cadastrar produto · Controle de Estoque{% endblock %}
{% block content %}
<section class="painel formulario">
    <h1>Cadastrar produto</h1>
    {% if erro %}<p class="mensagem erro" role="alert">{{ erro }}</p>{% endif %}
    <form method="post" action="{{ url_for('cadastrar') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="codigo">Código</label>
        <input id="codigo" name="codigo" type="number" step="1" required value="{{ dados.get('codigo', '') }}">

        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" required value="{{ dados.get('nome', '') }}">

        <label for="valor">Preço (R$)</label>
        <input id="valor" name="valor" type="text" inputmode="decimal" required
               aria-describedby="ajuda-preco" value="{{ dados.get('valor', '') }}">
        <small id="ajuda-preco">Use vírgula ou ponto, com até duas casas decimais. Exemplo: 10,50.</small>

        <label for="quantidade">Quantidade</label>
        <input id="quantidade" name="quantidade" type="number" min="0" step="1" required value="{{ dados.get('quantidade', '') }}">
        <div class="acoes">
            <button type="submit">Salvar produto</button>
            <a href="{{ url_for('listar_produtos') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
